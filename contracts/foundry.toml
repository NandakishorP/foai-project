[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./test/fixtures" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@prb/math/=lib/prb-math/",
    "poseidon2-evm/=lib/poseidon2-evm/src/",
]

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[fuzz]
runs = 256
