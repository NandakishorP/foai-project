# Season baseline (Phase 1 milestone): is research participation stable without predators?
#
# 30 markets per season, endogenous research (SPEC §2.1), no predators.
# Belief model from the E1 rule (D-016). Cost scale from the calibration rule (D-017).

extends: base.yaml
name: season_baseline

season:
  n_markets: 30

agents:
  belief_model: own_signals        # chosen by rule D-016 (E1)
  forecasters:
    research:
      mode: endogenous
      cost_median: 5.45            # D-017: median gross profit of a researching forecaster
                                   #   (results/calibrate_costs/calibration.json: 5.4486, n=2000)
