# Research-cost unit (DECISIONS D-017 procedure). Since D-029 the frozen cost median is
# 0.25 x this unit at the frozen rho and capital_ratio; the calibration grid recomputes it.
#
# Base config with the belief model chosen by the E1 rule (D-016), single markets,
# everyone researching, no predators. `python -m tfs calibrate-costs` reports the
# median gross trading profit of a researching forecaster. That number becomes
# research.cost_median in the season configs.

extends: base.yaml
name: calibrate_costs

agents:
  belief_model: own_signals   # chosen by rule D-016 from E1 (aggregation RMS 0.178 vs 0.245, CIs disjoint)
