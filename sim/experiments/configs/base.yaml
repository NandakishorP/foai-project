# Base configuration. Every parameter lives here, with its rationale.
# Experiments `extends: base.yaml` and override only what they change.
#
# Scale-setting idea: information strength is specified in "nats", the expected
# total log-likelihood ratio a source contributes to the posterior log-odds per
# market. Signal noise sigma is derived from it (see tfs.core.information). The
# market's hidden truth then becomes knowable at a controlled pace instead of
# depending on an arbitrary sigma.

name: base

seeds:
  count: 200          # SPEC §7 default: 200 independent runs per configuration
  start: 0

season:
  n_markets: 1        # single market by default; season experiments set 30 (SPEC §2.1)

market:
  ticks: 200          # blocks per market: long enough for ~10 public news items and a mid-market shock
  prior: 0.5          # SPEC §2 default prior pi
  b_main: 100.0       # LMSR liquidity. 100 shares move the log-odds by 1. Comparable to the
                      #   combined forecaster bankroll (10 x 100), so informed capital can move
                      #   the price but not trivially. Swept in E1.
  b_ref: 30.0         # reference venue is smaller than the main market (DECISIONS D-005)

information:
  mu: 1.0             # only mu/sigma matters; mu fixes the scale
  precision_scale: 1.0  # multiplies all signal precisions; swept in E1
  public:
    rate: 0.05        # ~10 public news items per market
    expected_nats: 2.0  # public news alone moves log-odds by ~2 in expectation (p ~ 0.88)
  private:            # research signals, correlated across forecasters (DECISIONS D-024)
    rate: 0.05        # ~10 research events per market; each gives every forecaster a signal
    pooled_nats: 2.0  # all forecasters' research together is worth ~2 nats: as much as all public news.
                      # Total with the shock is ~5 nats: p*_full ends near 0.99 but stays well
                      # inside (0,1) for most of the market, so accuracy metrics do not saturate.
    rho: 1.0          # FROZEN by calibration D-029/D-030: one shared research signal (textbook
                      #   Grossman-Stiglitz). Only rho = 1 met both baseline criteria; see the grid.
    max_delay: 0      # research reaches all researchers at once; exploratory X-3 staggers it by 0-3 ticks
  shocks:
    - tick: 100       # one true breaking-news event mid-market (Topic 6 shock; time-to-epsilon)
      nats: 1.0       # a single signal worth half of all routine public news

agents:
  belief_model: own_signals   # SPEC default; price_anchored is the alternative (DECISIONS D-013)

  forecasters:
    count: 10
    capital_ratio: 2.0  # bankroll = capital_ratio x b_main, fixed per market (D-015, D-029).
                        #   FROZEN by calibration D-029/D-030 (bankroll 200 at b_main 100)
    kelly_fraction: 0.25  # quarter-Kelly: common practice to limit estimation-error risk
    public_latency: 1     # sees public news one block after it is published
    max_order: 20.0       # simple execution cap per block (order splitting comes in Phase 3)
    min_order: 0.5        # ignore dust-sized adjustments
    research:
      mode: always        # E1 fixes participation; season experiments use "endogenous"
      cost_median: null   # set by the cost-calibration rule (DECISIONS D-017) for endogenous runs
      cost_log_sigma: 0.5 # costs vary ~x1.6 across forecasters (one log-sd), giving a smooth participation fraction
      ema_alpha: 0.3      # weights the latest market ~30%: adapts within a few markets, not jumpy
      explore_prob: 0.05  # SPEC §2.1 epsilon: a forecaster that quit retries ~once per 20 markets

  public_main:            # carries public news into the main market (DECISIONS D-019)
    count: 1
    bankroll: 100.0
    kelly_fraction: 0.25
    delay: 1
    max_order: 20.0
    min_order: 0.5
  public_ref:             # the reference venue sees public news only, with a delay (D-005)
    count: 1
    bankroll: 30.0        # scaled with b_ref
    kelly_fraction: 0.25
    delay: 5
    max_order: 6.0
    min_order: 0.5

  noise_main:
    count: 5
    rate: 0.1             # ~100 noise orders per market in total
    mean_size: 3.0        # each moves log-odds by ~0.03; random-walk sd ~0.3 over a market
    bankroll: 1000.0      # never cash-constrained
  noise_ref:
    count: 3
    rate: 0.1
    mean_size: 1.0        # scaled with b_ref: similar relative noise to the main market
    bankroll: 1000.0

  arbitrageurs:
    count: 1
    capital: 500.0
    min_profit: 0.05      # ignore gaps worth less than 5 cents
    slippage: 0.02        # tolerance on each leg's average price

  predators:              # MEV predator (SPEC §6). Reference values fixed before any E2 run (PREREGISTRATION rule 5).
    count: 0              # no predators in the baseline; E2a/E2b set the reference of 1 and sweep {1, 2, 4}
    latency: 0.2          # reads a pending tx if it arrives in the first 80% of the block interval:
                          #   fast but not omniscient; the middle of the E2a sweep {0.05, 0.2, 0.5}
    capital_ratio: 2.0    # bankroll = 2 x b_main: as well funded as one informed forecaster (D-030)
    horizon: 10           # H ticks. Researchers push the shared signal in over several ticks (max_order 20
                          #   = 0.2 log-odds per tick each); public news arrives about every 20 ticks. So 10 ticks
                          #   capture order-flow continuation and stay shorter than the gap between news items.
    markout_threshold: 0.0  # success = "the price kept moving the trade's way at all". Noise trades succeed
                          #   ~half the time, matching the Beta(1,1) prior mean, so P(informed) = 2θ − 1
    drift_ema_alpha: 0.1  # E[drift | informed] averages the last ~10 informed markouts
    bid_share: 0.5        # bids half its expected gross profit to the builder for the front slot
    min_profit: 0.01      # one cent
    slippage: 0.01        # tolerance on the front-run's average price (same scale as the arbitrageur's)
    own_impact_reversion: 1.0  # its own front-run carries no information, so informed traders, the public-news
                          #   trader and the arbitrageur push it back within H ticks; it expects to exit with
                          #   its own impact undone (the victim's impact and the informed drift remain).
                          #   Without this, LMSR convexity makes "buy as much as possible" look profitable.
    back_run: false       # reference predator holds H ticks to ride the informed drift (SPEC §6: front-runs,
                          #   back-running optional); the sandwich variant is reported in E2a

  trend:
    count: 2
    fast_span: 5          # classic fast/slow EMA crossover
    slow_span: 20
    threshold: 0.02       # act on a 2-point gap between fast and slow price averages
    order_size: 2.0
    max_position: 20.0
    bankroll: 200.0

mempool:
  policy: public          # pending transactions are readable by anyone (after their latency)
  base_fee: 0.0           # 0 so the no-predator baseline is exactly the frozen calibration (D-033)
  # Sealed-batch settings (used only by commit_reveal / zk_batch; D-046):
  batch_interval: 5       # K = 5 blocks ~ one minute of 12-second blocks (E3 reference); swept {1,2,5,10,20}
  escrow_tiers: [5.0, 25.0, 125.0, 625.0]  # x5 steps: escrow shows only a coarse size bucket
  proving_delay: 0        # PLACEHOLDER: set from the bb proving benchmark before any E3 run (D-046 point 7)
  sender_visible: true    # commits come from the trader's own address (reference); false = relayer variant

metrics:
  epsilon: 0.05           # "close enough" to p*_avail for time-to-epsilon
